<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Absensi Pegawai</title>
<style>
:root{--bg:#fff7ed;--card:#fff;--ink:#1c1917;--mut:#78716c;--line:#f1e4d6;--pri:#ea580c;--pri2:#c2410c;--ok:#16a34a;--no:#dc2626;--warn:#d97706;--soft:#ffedd5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 90px}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 14px}
header h1{font-size:18px;margin:0;letter-spacing:-.2px}
header .sub{font-size:12.5px;color:var(--mut)}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:22px;color:var(--pri2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(120,60,0,.04)}
.card h3{margin:0 0 8px;font-size:15px}
.mut{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:12px 14px;font:inherit;font-weight:600;cursor:pointer;background:var(--soft);color:var(--pri2)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--pri);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.no{background:var(--no);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{display:inline-block;width:auto;padding:7px 11px;font-size:13px;border-radius:9px}
.btn[disabled]{opacity:.45}
.big{font-size:22px;padding:22px 14px;border-radius:18px;letter-spacing:.5px}
.name{font-size:17px;padding:18px 10px;background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px dashed var(--line)}
.row:first-of-type{border-top:0}
.row.tap{cursor:pointer}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;margin-left:4px}
.t-auto{background:#fef3c7;color:#92400e}.t-run{background:#dcfce7;color:#166534}.t-wait{background:#e0e7ff;color:#3730a3}.t-no{background:#fee2e2;color:#991b1b}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:10px 11px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri)}
.pin{font-size:28px;text-align:center;letter-spacing:12px}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;background:var(--bg);margin-bottom:4px}
.tabs button{flex:0 0 auto;border:0;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 13px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.badge{background:var(--no);color:#fff;border-radius:999px;font-size:11px;padding:1px 6px;margin-left:4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 4px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--mut);font-weight:600}
td.r,th.r{text-align:right}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.nav .t{flex:1;text-align:center;font-weight:700}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;max-width:90%;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.err{background:var(--no)}
.modal{position:fixed;inset:0;background:rgba(28,25,23,.45);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px 22px}
.sheet h3{margin:0 0 6px}
pre.wa{white-space:pre-wrap;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:12px;font:13px/1.45 ui-monospace,Menlo,monospace;max-height:45vh;overflow:auto}
.busy{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--pri),#fdba74,var(--pri));background-size:200% 100%;animation:b 1s linear infinite;z-index:60}
@keyframes b{to{background-position:-200% 0}}
.demo{background:#1c1917;color:#fde68a;font-size:12.5px;padding:8px 12px;border-radius:10px;margin-bottom:12px}
.demo b{color:#fff}
.foot{text-align:center;margin-top:18px}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;font:inherit;font-size:13px;cursor:pointer}
.hello{font-size:20px;font-weight:700;margin:0}
.status{border-radius:14px;padding:12px;margin:10px 0 12px;background:var(--soft)}
.status.run{background:#dcfce7}
.hr{height:1px;background:var(--line);margin:12px 0}
details summary{cursor:pointer;font-weight:600;padding:4px 0}
.pegrow{display:grid;grid-template-columns:1fr 90px 52px;gap:6px;align-items:center;margin-bottom:6px}
.shrow{display:grid;grid-template-columns:1fr 92px 92px;gap:6px;margin-bottom:6px}
.jrow{display:grid;grid-template-columns:62px 1fr 1fr;gap:6px;align-items:center;margin-bottom:6px;font-size:13px;font-weight:600}
.jrow select{padding:8px 6px;font-size:13.5px}
.sw{width:22px;height:22px;accent-color:var(--pri)}
.alarm{background:#fee2e2;border:1px solid #fecaca;color:#991b1b;border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.t-hp{background:#fce7f3;color:#9d174d}.t-ed{background:#e0f2fe;color:#075985}.t-lib{background:#e7e5e4;color:#44403c}.t-kh{background:#ede9fe;color:#5b21b6}
.card.kosong{border-color:#fca5a5;background:#fff5f5}.card.kurang{border-color:#fcd34d}.card.libur{opacity:.7}
.jslot{display:grid;grid-template-columns:64px 1fr 40px;gap:6px;align-items:center;margin-bottom:8px}
.jlbl{font-size:13px;font-weight:600}
.jsel{display:grid;gap:6px}.jsel select{padding:8px 6px;font-size:13.5px}
.pengumuman{background:#eff6ff;border-color:#bfdbfe}
.antri{background:#fef9c3;border-color:#fde047}
.jrow .lb{display:flex;flex-direction:column;align-items:center;font-size:10.5px;color:var(--mut);font-weight:600}
.shcard{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.loge{padding:9px 0;border-top:1px dashed var(--line);font-size:13.5px}
.loge b{font-size:13px}
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ea580c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Absensi">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<script src="config.js"></script>
<script>
if (window.KONFIG && KONFIG.ONESIGNAL_APP_ID) {
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  OneSignalDeferred.push(function (OneSignal) { return OneSignal.init({ appId: KONFIG.ONESIGNAL_APP_ID }); });
  var s = document.createElement('script'); s.src = 'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js'; s.defer = true; document.head.appendChild(s);
}
</script>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1 id="hWarung">Absensi</h1><div class="sub" id="hTgl">Memuat…</div></div>
    <div class="clock" id="clock">--.--</div>
  </header>
  <div id="demoBar"></div>
  <main id="view"><div class="card mut">Memuat aplikasi…</div></main>
</div>
<div id="busy"></div><div id="toastBox"></div><div id="modalBox"></div>

<script>
var S = { init:null, user:null, status:null, pilih:null, mode:'pegawai', adm:{ tab:'hari' } };
var busyN = 0;

// ---------- util ----------
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function titik(t){ return t ? String(t).replace(':','.') : '-'; }
function ls(k,v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,JSON.stringify(v)); }catch(e){ return null; } }
function busy(on){ busyN += on?1:-1; $('busy').innerHTML = busyN>0 ? '<div class="busy"></div>' : ''; }
function api(name){
  var args = Array.prototype.slice.call(arguments,1);
  return apiSekali(name,args).catch(function(e){
    if (e && !e.jaringan && /kunci|lock|sibuk/i.test(e.message||'')){
      return new Promise(function(r){ setTimeout(r,1500); }).then(function(){ return apiSekali(name,args); })
        .catch(function(e2){ if (e2 && /kunci|lock|sibuk/i.test(e2.message||'')) return new Promise(function(r){ setTimeout(r,3000); }).then(function(){ return apiSekali(name,args); }); throw e2; });
    }
    throw e;
  });
}
function apiSekali(name,args){
  busy(true);
  return new Promise(function(res,rej){
    function ok(v){ busy(false); res(v); } function no(e){ busy(false); rej(e); }
    if (window.DEMO){ setTimeout(function(){ try{ ok(DEMO.call(name,args)); }catch(e){ no(e); } },120); return; }
    if (window.KONFIG && KONFIG.API_URL){
      fetch(KONFIG.API_URL,{method:'POST',body:JSON.stringify({fn:name,args:args})})
        .then(function(r){ return r.json(); })
        .then(function(j){ if(j.ok) ok(j.data); else no(new Error(j.error)); })
        .catch(function(){ var e=new Error('Tidak tersambung. Cek sinyal/internet lalu coba lagi.'); e.jaringan=true; no(e); });
      return;
    }
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(no);
    r[name].apply(r,args);
  });
}
function hpId(){ var h=ls('absensi-hp'); if(!h){ h='hp-'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); ls('absensi-hp',h); } return h; }
// ---------- notifikasi (hanya versi GitHub Pages) ----------
var NOTIF = !!(window.KONFIG && KONFIG.ONESIGNAL_APP_ID);
function os(fn){ if(!NOTIF) return; window.OneSignalDeferred=window.OneSignalDeferred||[]; OneSignalDeferred.push(fn); }
function notifLogin(id){ os(function(O){ if (O.Notifications.permission) O.login(String(id)).catch(function(){}); }); }
function notifLogout(){ os(function(O){ try{ O.logout(); }catch(e){} }); }
function iosBelumDipasang(){ var ua=navigator.userAgent; return /iPhone|iPad|iPod/.test(ua) && !(window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)); }
function cekNotif(cb){
  if (!NOTIF) return cb('mati');
  if (iosBelumDipasang()) return cb('ios');
  os(function(O){ try{ cb(!O.Notifications.isPushSupported() ? 'tidak' : O.Notifications.permission ? 'aktif' : 'belum'); }catch(e){ cb('tidak'); } });
}
function aktifkanNotif(id, selesai){
  os(function(O){
    O.Notifications.requestPermission().then(function(){
      if (!O.Notifications.permission){ toast('Izin notifikasi ditolak. Aktifkan lewat pengaturan browser.',true); return; }
      return O.login(String(id)).then(function(){ toast('Notifikasi aktif 🔔'); if(selesai) selesai(); });
    }).catch(gagal);
  });
}
function kartuNotif(el, id){
  cekNotif(function(st){
    var box=$(el); if(!box) return;
    if (st==='aktif'){ notifLogin(id); box.innerHTML=''; return; }
    if (st==='belum') box.innerHTML='<div class="card" style="border-color:#fdba74"><b>🔔 Aktifkan pengingat</b><p class="mut" style="margin:4px 0 10px">Dapat notifikasi 1 jam sebelum jadwal jaga, dan pengingat kalau lupa absen.</p><button class="btn pri" onclick="aktifkanNotif(\''+id+'\',function(){kartuNotif(\''+el+'\',\''+id+'\')})">Aktifkan notifikasi</button></div>';
    else if (st==='ios') box.innerHTML='<div class="card"><b>🔔 Pengingat di iPhone</b><p class="mut" style="margin:4px 0 0">Tekan tombol Bagikan (kotak panah) → <b>Tambahkan ke Layar Utama</b>, lalu buka aplikasi dari ikon itu untuk mengaktifkan notifikasi.</p></div>';
    else box.innerHTML='';
  });
}

function toast(msg,err){ var b=$('toastBox'); b.innerHTML='<div class="toast'+(err?' err':'')+'">'+esc(msg)+'</div>'; clearTimeout(toast.t); toast.t=setTimeout(function(){b.innerHTML='';}, err?4500:2600); }
function gagal(e){ toast((e&&e.message)||String(e),true); }
function modal(html){ $('modalBox').innerHTML = html ? '<div class="modal" onclick="if(event.target===this)modal()"><div class="sheet">'+html+'</div></div>' : ''; }
function addDays(s,n){ var p=s.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]+n); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
var HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'], BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function tglPendek(s){ var p=s.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]); return HARI[d.getDay()]+', '+(+p[2])+' '+BLN[d.getMonth()]; }
function menitKe(t){ var p=String(t).split(':'); return (+p[0])*60+(+p[1]); }
function jamDari(m){ m=Math.max(0,m); return ('0'+Math.floor(m/60)).slice(-2)+':'+('0'+m%60).slice(-2); }
function durasi(m){ var j=Math.floor(m/60), x=m%60; return (j?j+'j ':'')+(x||!j? x+'m':''); }
function sp(n){ return '<div style="height:'+(n||8)+'px"></div>'; }
function dua(h){ return h; }
function salin(text){
  function fb(){ var t=document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select(); try{document.execCommand('copy');}catch(e){} document.body.removeChild(t); }
  try{ if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(fb); else fb(); }catch(e){ fb(); }
  toast('Tersalin. Tempel di grup WA ✅');
}
function tampilTeks(judul,text){
  S._teks = text;
  modal('<h3>'+esc(judul)+'</h3><pre class="wa">'+esc(text)+'</pre><div class="grid"><button class="btn pri" onclick="salin(S._teks)">Salin</button><a class="btn ok" style="text-align:center;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(text)+'">Buka WhatsApp</a></div>'+sp()+'<button class="btn ghost" onclick="modal()">Tutup</button>');
}
function tagEntri(e,admin){
  var t='';
  if (e.status==='menunggu') t+='<span class="tag t-wait">menunggu</span>';
  else if (e.status==='ditolak') t+='<span class="tag t-no">ditolak</span>';
  else if (e.berjalan) t+='<span class="tag t-run">jaga</span>';
  else if (e.otomatis) t+='<span class="tag t-auto">otomatis</span>';
  if (admin){
    if (e.sumber==='susulan' && e.status==='ok') t+='<span class="tag t-wait">susulan</span>';
    if (e.diubah) t+='<span class="tag t-ed">diubah</span>';
    if (e.hpLain) t+='<span class="tag t-hp">HP lain</span>';
    if (e.tablet) t+='<span class="tag t-run">📍 tablet</span>';
    if (e.sumber==='offline') t+='<span class="tag t-auto">📶 offline</span>';
    if (e.luarJadwal) t+='<span class="tag t-kh">di luar jadwal</span>';
  }
  return t;
}
function jamEntri(e){ return titik(e.datang)+' – '+(e.berjalan?'…':titik(e.pulangEff)); }
function shiftsUntuk(t){ return S.init.shifts.concat(S.init.khusus.filter(function(k){return k.tanggal===t;})).sort(function(a,b){return menitKe(a.mulai)-menitKe(b.mulai);}); }
function opsiShift(t,pilih){ return shiftsUntuk(t).map(function(s){return '<option value="'+s.id+'"'+(s.id===pilih?' selected':'')+'>'+esc(s.nama)+' ('+titik(s.mulai)+'–'+titik(s.selesai)+')</option>';}).join(''); }

// ---------- jam ----------
function tick(){ var d=new Date(); $('clock').textContent=('0'+d.getHours()).slice(-2)+'.'+('0'+d.getMinutes()).slice(-2); }
setInterval(tick,10000); tick();

// ---------- absen saat internet putus ----------
function antrian(){ return ls('absensi-antrian')||[]; }
function gagalKirim(){ return ls('absensi-antrian-gagal')||[]; }
function waktuSekarang(){ var d=new Date(); return {tanggal:d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2), jam:('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}; }
function masukAntrian(fn,args,ket){
  var a=antrian(), w=waktuSekarang(); a.push({fn:fn,args:args,waktu:w,ket:ket,nama:args[0]}); ls('absensi-antrian',a);
  toast('📶 Internet putus. Absen '+ket+' ('+titik(w.jam)+') disimpan dan dikirim otomatis saat online.');
  return w;
}
function kirimAntrian(){
  var a=antrian(); if (!a.length || S._kirimAntri) return;
  S._kirimAntri=true;
  var x=a[0];
  api.apply(null,[x.fn].concat(x.args).concat([x.waktu])).then(function(){
    ls('absensi-antrian',antrian().slice(1)); S._kirimAntri=false; toast('✅ Absen tertunda '+x.nama+' ('+x.ket+') terkirim'); kirimAntrian(); segarkanTampilan();
  }).catch(function(e){
    S._kirimAntri=false;
    if (e && e.jaringan) return;
    var g=gagalKirim(); g.push({nama:x.nama,ket:x.ket,waktu:x.waktu,pesan:e.message}); ls('absensi-antrian-gagal',g);
    ls('absensi-antrian',antrian().slice(1)); kirimAntrian(); segarkanTampilan();
  });
}
function segarkanTampilan(){ if (S.mode!=='pegawai' || $('modalBox').innerHTML) return; if (S.user && S.status) viewHome(); else if (!S.user && S.init) viewNama(); }
function kartuAntrian(){
  var a=antrian(), g=gagalKirim(), h='';
  if (a.length) h+='<div class="card antri"><b>⏳ '+a.length+' absen menunggu internet</b>'+a.map(function(x){return '<div class="mut">'+esc(x.nama)+' · '+esc(x.ket)+' · '+titik(x.waktu.jam)+'</div>';}).join('')+'<div class="mut" style="margin-top:4px">Akan terkirim otomatis begitu online.</div></div>';
  if (g.length) h+='<div class="card" style="border-color:#fecaca"><b>⚠️ Absen tertunda yang ditolak</b>'+g.map(function(x){return '<div class="mut">'+esc(x.nama)+' · '+esc(x.ket)+' '+titik(x.waktu.jam)+': '+esc(x.pesan)+'</div>';}).join('')+'<div class="mut">Gunakan Absen Susulan untuk yang ditolak.</div><button class="btn sm ghost" style="margin-top:6px" onclick="ls(\'absensi-antrian-gagal\',null);segarkanTampilan()">Tutup</button></div>';
  return h;
}
window.addEventListener('online',function(){ kirimAntrian(); });
setInterval(kirimAntrian,30000);
function kartuPengumuman(list){
  return (list||[]).map(function(p){ return '<div class="card pengumuman"><b>📢 '+esc(p.judul)+'</b><div>'+esc(p.isi)+'</div><div class="mut" style="font-size:12px">'+esc(p.waktu)+'</div></div>'; }).join('');
}

// ---------- mulai ----------
function mulai(){
  if (window.DEMO) $('demoBar').innerHTML='<div class="demo"><b>Mode demo</b>: data hanya tersimpan di HP ini. PIN pegawai: Diza 1111, Bintang 2222, Levi 3333, Aldiva 4444, Shinta 5555. PIN pemilik: 1234. <button class="link" style="color:#fde68a" onclick="DEMO.reset();ls(\'absensi-user\',null);ls(\'absensi-admin\',null);location.reload()">reset demo</button></div>';
  api('apiInit',hpId()).catch(function(e){
    var c=ls('absensi-init'); if (e.jaringan && c){ S.offline=true; toast('📶 Sedang offline. Absen tetap bisa, dikirim saat online.'); return c; } throw e;
  }).then(function(d){
    if (!S.offline) ls('absensi-init',d);
    S.init=d; $('hWarung').textContent=d.warung; $('hTgl').textContent=d.label.hari+', '+d.label.tanggal;
    setTimeout(kirimAntrian,1500);
    if (d.kiosk){ S.user=null; ls('absensi-user',null); ls('absensi-admin',null); notifLogin('warung'); return viewNama(); }
    S.user = ls('absensi-user');
    if (ls('absensi-admin')) { S.adm.pin=ls('absensi-admin'); return bukaAdmin(); }
    if (S.user){ var cs=ls('absensi-status'); if (S.offline && cs && cs.nama===S.user.nama){ S.status=cs; viewHome(); } else muatStatus(); } else viewNama();
  }).catch(function(e){ $('view').innerHTML='<div class="card">Gagal memuat: '+esc(e.message||e)+'<div style="height:10px"></div><button class="btn pri" onclick="location.reload()">Coba lagi</button></div>'; });
}
function segarkan(){ if (S.mode==='pegawai' && S.user && S.status && !$('modalBox').innerHTML) muatStatus(true); }
document.addEventListener('visibilitychange',function(){ if(!document.hidden) segarkan(); });
setInterval(function(){ if(!document.hidden) segarkan(); },60000);

// ---------- PEGAWAI ----------
function viewNama(){
  S.mode='pegawai';
  var h=S.init.kiosk ? '<div class="card"><h3>📍 Absen di warung</h3><p class="mut" style="margin:0 0 12px">Ketuk namamu, masukkan PIN, lalu absen.</p><div class="grid">'
    : '<div class="card"><h3>Siapa kamu?</h3><p class="mut" style="margin:0 0 12px">Pilih namamu. Cukup sekali, berikutnya HP ini akan mengingatmu.</p><div class="grid">';
  S.init.pegawai.forEach(function(n){ h+='<button class="btn name" data-n="'+esc(n)+'" onclick="viewPin(this.dataset.n)">'+esc(n)+'</button>'; });
  if (!S.init.pegawai.length) h+='<p class="mut">Belum ada pegawai. Pemilik bisa menambahkannya di menu Pemilik.</p>';
  h+='</div></div>'+kartuAntrian()+(S.init.kiosk?kartuPengumuman(S.init.pengumuman):'')+'<button class="btn ghost" onclick="bantuan()">❓ Bantuan cara pakai</button><div class="foot"><button class="link" onclick="viewAdminLogin()">Masuk sebagai pemilik</button></div>';
  $('view').innerHTML=h;
}
function viewPin(nama){
  $('view').innerHTML='<div class="card"><h3>Halo, '+esc(nama)+' 👋</h3><p class="mut" style="margin:0">Masukkan PIN kamu.</p>'+
    '<input id="pin" class="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" onkeyup="if(event.key===\'Enter\')cekPin()">'+
    sp(12)+'<button class="btn pri" onclick="cekPin()">Lanjut</button>'+sp()+'<button class="btn ghost" onclick="viewNama()">Bukan saya</button></div>';
  S._nama=nama; setTimeout(function(){ $('pin').focus(); },50);
}
function cekPin(){
  var pin=$('pin').value.trim();
  api('apiStatusSaya',S._nama,pin).then(function(st){ S.user={nama:st.nama,pin:pin}; if(!S.init.kiosk) ls('absensi-user',S.user); else S.offline=false; S.status=st; if(!S.init.kiosk) ls('absensi-status',st); viewHome(); })
  .catch(function(e){ if (e.jaringan) viewOffline(S._nama,pin); else gagal(e); });
}
function muatStatus(diam){
  api('apiStatusSaya',S.user.nama,S.user.pin).then(function(st){ S.status=st; S.offline=false; if(!S.init.kiosk) ls('absensi-status',st); viewHome(); })
  .catch(function(e){ if(!diam) gagal(e); if(/PIN|Nama/.test(e.message||'')){ ls('absensi-user',null); S.user=null; viewNama(); } });
}
function selesaiKiosk(){ clearTimeout(S.kt); S.user=null; S.status=null; modal(); viewNama(); }
function aturTimerKiosk(){ clearTimeout(S.kt); if (S.init && S.init.kiosk && S.user) S.kt=setTimeout(selesaiKiosk,30000); }
document.addEventListener('click',function(){ if (S.init && S.init.kiosk && S.user && S.mode==='pegawai') aturTimerKiosk(); },true);
function keluarPegawai(){ if (S.init.kiosk) return selesaiKiosk(); notifLogout(); ls('absensi-user',null); S.user=null; S.status=null; viewNama(); }

function viewHome(){
  S.mode='pegawai';
  var st=S.status, h='<div id="notifBox"></div>'+kartuAntrian()+(S.offline?'<div class="card antri">📶 Sedang offline — data mungkin belum terbaru.</div>':'')+kartuPengumuman(st.pengumuman)+'<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><p class="hello">Halo, '+esc(st.nama)+' 👋</p><button class="link" onclick="keluarPegawai()">ganti</button></div>';
  if (st.berjalan){
    var b=st.berjalan;
    h+='<div class="status run"><b>Sedang jaga shift '+esc(b.shiftNama)+'</b><br><span class="mut">Masuk jam '+titik(b.datang)+'. Shift selesai '+titik(b.selesai)+'.</span></div>'+
      '<button class="btn no big" onclick="tanyaPulang()">ABSEN PULANG</button>'+
      '<p class="mut" style="margin:10px 2px 0">Lupa absen pulang? Tenang, otomatis tercatat '+titik(b.selesai)+'.'+(b.batasHitung!==b.selesai?' Jam pulang dihitung paling lambat '+titik(b.batasHitung)+'.':'')+'</p>';
  }
  if (st.bisaBatal && !st.berjalan){
    var bb=st.bisaBatal;
    h+='<div class="status" style="background:#fef3c7"><b>Absen pulang shift '+esc(bb.shiftNama)+' tercatat '+titik(bb.pulang)+'.</b><br><span class="mut">Terpencet? Masih bisa dibatalkan sekitar '+bb.sisa+' menit lagi.</span></div>'+
      '<button class="btn ghost" onclick="batalPulang()">↩️ Batalkan (terpencet)</button>';
  }
  if (st.terbuka.length){
    if (!S.pilih || !st.terbuka.some(function(x){return x.id===S.pilih;})) S.pilih = pilihDefault(st.terbuka, st.now.jam);
    if (st.berjalan) h+='<div class="hr"></div>';
    h+='<div class="mut" style="margin-top:8px">'+(st.berjalan?'Absen masuk shift berikutnya:':'Shift:')+'</div><div class="chips">';
    st.terbuka.forEach(function(x){ h+='<button class="chip'+(x.id===S.pilih?' on':'')+'" onclick="S.pilih=\''+x.id+'\';viewHome()">'+esc(x.nama)+' · '+titik(x.mulai)+'–'+titik(x.selesai)+'</button>'; });
    h+='</div><button class="btn ok big" onclick="masuk()">ABSEN MASUK</button>';
  }
  if (!st.berjalan && !st.terbuka.length){
    h+='<div class="status">Belum ada shift yang bisa diabsen sekarang.'+(st.berikut?'<br><span class="mut">Shift '+esc(st.berikut.nama)+' ('+titik(st.berikut.mulai)+') bisa diabsen mulai jam '+titik(st.berikut.buka)+'.</span>':'')+'</div>';
  }
  h+='</div>';
  (st.permintaanTeman||[]).forEach(function(r){
    h+='<div class="card" style="border-color:#c4b5fd;background:#f5f3ff"><b>🔁 '+esc(r.dari)+' minta kamu menggantikan</b><div>'+esc(tglPendek(r.tanggal))+' · '+esc(r.shiftNama)+' '+titik(r.mulai)+'–'+titik(r.selesai)+'</div><div class="mut">Alasan: '+esc(r.alasan)+'</div>'+sp(8)+
      '<div style="display:flex;gap:8px"><button class="btn ok sm" onclick="jawabTukar(\''+r.id+'\',true)">✓ Setuju, saya ganti</button><button class="btn no sm" onclick="jawabTukar(\''+r.id+'\',false)">✕ Tidak bisa</button></div>'+
      '<div class="mut" style="margin-top:6px">Kalau setuju, permintaan diteruskan ke pemilik untuk disetujui.</div></div>';
  });
  if (st.hariIni.length){
    h+='<div class="card"><h3>Absenmu hari ini</h3>';
    st.hariIni.forEach(function(e){ h+='<div class="row"><div><b>'+esc(e.shiftNama)+'</b>'+tagEntri(e)+'</div><div>'+jamEntri(e)+'</div></div>'; });
    h+='</div>';
  }
  if (st.jadwal.length){
    h+='<div class="card"><h3>Jadwal jagamu</h3>';
    st.jadwal.forEach(function(j){ h+='<div class="row"><div>'+(j.tanggal===st.now.tanggal?'<b>Hari ini</b>':esc(tglPendek(j.tanggal)))+'<br><span class="mut">'+esc(j.shiftNama)+' · '+titik(j.mulai)+'–'+titik(j.selesai)+'</span></div><button class="btn sm ghost" onclick="viewAjuan(\''+j.tanggal+'\',\''+j.shift+'\')">Izin / tukar</button></div>'; });
    h+='</div>';
  }
  if (st.ajuan.length){
    h+='<div class="card"><h3>Pengajuanmu</h3>';
    st.ajuan.forEach(function(a){
      var tg = a.status==='menunggu'?'<span class="tag t-wait">menunggu pemilik</span>':a.status==='menunggu-teman'?'<span class="tag t-wait">menunggu '+esc(a.pengganti)+'</span>':a.status==='disetujui'?'<span class="tag t-run">disetujui</span>':a.status==='ditolak-teman'?'<span class="tag t-no">ditolak '+esc(a.pengganti)+'</span>':'<span class="tag t-no">ditolak</span>';
      h+='<div class="row"><div>'+(a.jenis==='izin'?'Izin':'Tukar → '+esc(a.pengganti))+tg+'<br><span class="mut">'+esc(tglPendek(a.tanggal))+' · '+esc(a.shiftNama)+'</span></div>'+((a.status==='menunggu'||a.status==='menunggu-teman')?'<button class="btn sm ghost" onclick="batalAjuan(\''+a.id+'\')">Batalkan</button>':'')+'</div>';
    });
    h+='</div>';
  }
  h+='<div class="grid"><button class="btn" onclick="viewSusulan()">Lupa absen?<br><small>Absen susulan</small></button><button class="btn" onclick="viewAjuan()">Izin / tukar<br><small>shift</small></button>'+
    '<button class="btn" onclick="jamKerjaku()">Jam kerjaku<br><small>periode ini</small></button><button class="btn" onclick="lihatHariIni()">Siapa jaga<br><small>hari ini</small></button></div>'+
    sp()+'<div class="grid"><button class="btn" onclick="jadwalSemua()">📅 Jadwal<br><small>semua orang</small></button><button class="btn" onclick="jamLuangku()">🗓️ Jam luangku'+(st.jamLuangDiisi===false?' <span class="badge">!</span>':'')+'<br><small>shift yang bisa</small></button></div>'+
    sp()+'<button class="btn ghost" onclick="bantuan()">❓ Bantuan cara pakai</button>';
  h+='<div class="foot"><button class="link" onclick="viewAdminLogin()">Masuk sebagai pemilik</button></div>';
  if (S.init.kiosk) h=h.replace('<div class="foot">','<button class="btn ghost" style="margin-top:12px" onclick="selesaiKiosk()">Selesai</button><p class="mut" style="text-align:center">Kembali ke daftar nama otomatis setelah 30 detik.</p><div class="foot">');
  $('view').innerHTML=h;
  if (S.init.kiosk) aturTimerKiosk(); else kartuNotif('notifBox', st.pegawaiId);
}
function pilihDefault(list, jam){
  var t=menitKe(jam);
  var dalam=list.filter(function(x){ return t>=menitKe(x.mulai)-60 && t<=menitKe(x.selesai); });
  return (dalam[0]||list[0]).id;
}
function masuk(){
  var sid=S.pilih, args=[S.user.nama,S.user.pin,sid,hpId()];
  api.apply(null,['apiMasuk'].concat(args)).then(function(st){ S.status=st; if(!S.init.kiosk) ls('absensi-status',st); viewHome(); toast('Absen masuk tercatat jam '+titik(st.now.jam)+' ✅'); if(S.init.kiosk) setTimeout(selesaiKiosk,2500); })
  .catch(function(e){
    if (!e.jaringan) return gagal(e);
    var sh=(S.status.terbuka||[]).filter(function(x){return x.id===sid;})[0]||{nama:sid,selesai:''};
    var w=masukAntrian('apiMasuk',args,'masuk '+sh.nama);
    S.status.berjalan={shift:sid,shiftNama:sh.nama,datang:w.jam,selesai:sh.selesai,batasHitung:sh.selesai};
    S.status.terbuka=(S.status.terbuka||[]).filter(function(x){return x.id!==sid;});
    if (!S.init.kiosk) ls('absensi-status',S.status);
    if (S.init.kiosk) setTimeout(selesaiKiosk,2500); else viewHome();
  });
}
function tanyaPulang(){
  var b=S.status.berjalan, now=waktuSekarang();
  if (b && b.selesai && menitKe(now.jam) < menitKe(b.selesai)){
    modal('<h3>Yakin pulang sekarang?</h3><p style="margin:6px 0 14px">Shift <b>'+esc(b.shiftNama)+'</b> baru selesai jam <b>'+titik(b.selesai)+'</b>. Sekarang jam '+titik(now.jam)+'.</p>'+
      '<button class="btn no" onclick="modal();pulang()">Ya, pulang sekarang</button>'+sp()+'<button class="btn ghost" onclick="modal()">Batal, masih jaga</button>');
    return;
  }
  pulang();
}
function batalPulang(){
  api('apiBatalPulang',S.user.nama,S.user.pin).then(function(st){ S.status=st; if(!S.init.kiosk) ls('absensi-status',st); viewHome(); toast('Absen pulang dibatalkan. Status kembali: sedang jaga ✅'); })
  .catch(function(e){ gagal(e.jaringan?new Error('Butuh internet untuk membatalkan. Coba lagi saat online.'):e); });
}
function pulang(){
  var args=[S.user.nama,S.user.pin,hpId()];
  api.apply(null,['apiPulang'].concat(args)).then(function(st){ S.status=st; if(!S.init.kiosk) ls('absensi-status',st); viewHome(); toast('Absen pulang tercatat. Terima kasih! 🙏'); if(S.init.kiosk){ clearTimeout(S.kt); S.kt=setTimeout(selesaiKiosk,8000); } })
  .catch(function(e){
    if (!e.jaringan) return gagal(e);
    masukAntrian('apiPulang',args,'pulang'+(S.status.berjalan?' '+S.status.berjalan.shiftNama:''));
    S.status.berjalan=null; if (!S.init.kiosk) ls('absensi-status',S.status);
    if (S.init.kiosk) setTimeout(selesaiKiosk,2500); else viewHome();
  });
}
// tablet offline: PIN belum bisa dicek, absen disimpan & dicek server saat online
function viewOffline(nama,pin){
  S.user={nama:nama,pin:pin};
  var now=waktuSekarang(), t=menitKe(now.jam);
  var buka=shiftsUntuk(now.tanggal).filter(function(s){ return t>=menitKe(s.mulai)-Math.max(60,s.tambahMasuk||0) && t<=menitKe(s.selesai); });
  S.pilih=buka.length?buka[0].id:null;
  var h='<div class="card antri"><b>📶 Sedang offline</b><div class="mut">PIN dan absen akan dicek otomatis begitu internet kembali.</div></div><div class="card"><p class="hello">Halo, '+esc(nama)+' 👋</p>';
  if (buka.length){
    h+='<div class="chips">'+buka.map(function(x){return '<button class="chip'+(x.id===S.pilih?' on':'')+'" onclick="S.pilih=\''+x.id+'\';document.querySelectorAll(\'.chip\').forEach(function(c){c.classList.remove(\'on\')});this.classList.add(\'on\')">'+esc(x.nama)+'</button>';}).join('')+'</div>';
    h+='<button class="btn ok big" onclick="masukOffline()">ABSEN MASUK</button>'+sp();
  }
  h+='<button class="btn no big" onclick="pulangOffline()">ABSEN PULANG</button>'+sp(12)+'<button class="btn ghost" onclick="selesaiKiosk()">Batal</button></div>';
  $('view').innerHTML=h; aturTimerKiosk();
}
function masukOffline(){ var sh=shiftsUntuk(waktuSekarang().tanggal).filter(function(x){return x.id===S.pilih;})[0]; masukAntrian('apiMasuk',[S.user.nama,S.user.pin,S.pilih,hpId()],'masuk '+(sh?sh.nama:'')); setTimeout(selesaiKiosk,2500); }
function pulangOffline(){ masukAntrian('apiPulang',[S.user.nama,S.user.pin,hpId()],'pulang'); setTimeout(selesaiKiosk,2500); }

// jam luang pegawai
function jadwalSemua(){
  var mulai=(S.status&&S.status.now?S.status.now.tanggal:waktuSekarang().tanggal);
  api('apiJadwal',mulai).then(function(j){
    var me=S.user?S.user.nama.toLowerCase():'';
    var h='<h3>📅 Jadwal 7 hari ke depan</h3><p class="mut" style="margin:0 0 6px">Namamu ditebalkan. Butuh tukar? Pakai tombol Izin / tukar.</p>';
    j.hari.forEach(function(d){
      h+='<div class="card" style="margin:8px 0;padding:10px 12px"><b>'+esc(tglPendek(d.tanggal))+'</b>';
      d.slot.forEach(function(s){
        var isi=s.libur?'<span class="tag t-lib">libur</span>':(s.nama.length?s.nama.map(function(n){return n.toLowerCase()===me?'<b style="color:var(--pri2)">'+esc(n)+'</b>':esc(n);}).join(', '):'<span class="mut">–</span>');
        h+='<div class="row" style="padding:5px 0"><div>'+esc(s.shiftNama)+' <span class="mut">'+titik(s.mulai)+'</span></div><div style="text-align:right">'+isi+'</div></div>';
      });
      h+='</div>';
    });
    modal(h+'<button class="btn ghost" onclick="modal()">Tutup</button>');
  }).catch(gagal);
}
function bantuan(){
  var q=[
    ['Absen masuk','Saat datang, buka aplikasi lalu tekan ABSEN MASUK. Tombol muncul mulai 1 jam sebelum shift.'],
    ['Absen pulang','Saat pulang, tekan ABSEN PULANG. Kalau lupa, otomatis tercatat jam akhir shift. Kalau terpencet, ada tombol Batalkan selama 5 menit.'],
    ['Lupa absen masuk','Tekan "Lupa absen? Absen susulan", isi tanggal, shift, jam, dan alasan. Nanti disetujui pemilik.'],
    ['Izin tidak masuk','Tekan "Izin / tukar shift" → Izin tidak masuk → isi alasan. Tunggu persetujuan pemilik.'],
    ['Minta digantikan teman','Tekan "Izin / tukar shift" → Digantikan teman → pilih teman. Temanmu menekan Setuju dulu, lalu pemilik menyetujui. Jadwal berubah otomatis.'],
    ['Jam luang','Tekan "Jam luangku", centang shift yang bisa kamu ambil. Perbarui setiap jadwal kuliah berubah. Ini hanya info untuk pemilik, tidak langsung mengubah jadwal.'],
    ['Notifikasi','Pasang aplikasi ke layar utama (Chrome: titik tiga → Tambahkan ke layar utama; iPhone: Safari → Bagikan → Tambahkan ke Layar Utama), buka dari ikon itu, lalu tekan Aktifkan notifikasi → Izinkan.'],
    ['Internet putus','Tetap tekan tombol absen. Absen disimpan di HP dan dikirim otomatis saat online, dengan jam saat tombol ditekan.'],
    ['Lihat jam kerja','Tekan "Jam kerjaku" untuk melihat total jam dan jumlah shift di periode gajian berjalan.'],
    ['Ganti HP','Pasang aplikasi di HP baru seperti biasa, lalu kabari pemilik supaya HP lamamu direset.']
  ];
  modal('<h3>❓ Cara pakai aplikasi absensi</h3>'+q.map(function(x){return '<details style="border-top:1px dashed var(--line);padding:6px 0"><summary>'+esc(x[0])+'</summary><div class="mut" style="padding:4px 0 2px">'+esc(x[1])+'</div></details>';}).join('')+sp(10)+'<button class="btn ghost" onclick="modal()">Tutup</button>');
}
function jamLuangku(){
  api('apiJamLuangSaya',S.user.nama,S.user.pin).then(function(r){
    S._jl=r;
    var h='<h3>🗓️ Jam luangku</h3><p class="mut" style="margin:0 0 8px">Centang shift yang <b>bisa</b> kamu ambil setiap minggu (sesuaikan dengan jadwal kuliah). Perbarui setiap jadwal kuliahmu berubah.</p>';
    r.hari.forEach(function(d,i){ h+='<div class="row"><div><b>'+esc(d.nama)+'</b></div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">'+d.slot.map(function(s,k){return '<button id="jl'+i+'_'+k+'" class="chip'+(s.bisa?' on':'')+'" onclick="this.classList.toggle(\'on\')">'+esc(s.shiftNama)+'</button>';}).join('')+'</div></div>'; });
    if (r.diperbarui) h+='<p class="mut">Terakhir diperbarui: '+esc(r.diperbarui)+'</p>';
    modal(h+sp(10)+'<button class="btn pri" onclick="simpanJamLuang()">Simpan</button>'+sp()+'<button class="btn ghost" onclick="modal()">Batal</button>');
  }).catch(gagal);
}
function simpanJamLuang(){
  var out=[]; S._jl.hari.forEach(function(d,i){ d.slot.forEach(function(s,k){ if($('jl'+i+'_'+k).classList.contains('on')) out.push({hari:d.hari,shift:s.shift}); }); });
  api('apiSimpanJamLuang',S.user.nama,S.user.pin,out).then(function(r){ modal(); toast(r.pesan); muatStatus(true); }).catch(gagal);
}

function lihatHariIni(){
  api('apiHariIni','').then(function(d){
    var h='<h3>Yang jaga hari ini</h3><p class="mut" style="margin:0 0 6px">'+esc(d.label.hari+', '+d.label.tanggal)+'</p>';
    d.shifts.forEach(function(s){
      h+='<div class="card'+(s.libur?' libur':'')+'" style="margin:8px 0"><b>'+esc(s.nama)+'</b> <span class="mut">'+titik(s.mulai)+'–'+titik(s.selesai)+'</span>'+(s.libur?'<span class="tag t-lib">libur</span>':'');
      if (s.jadwal.length && !s.libur) h+='<div class="mut">Jadwal: '+esc(s.jadwal.join(', '))+'</div>';
      if (!s.entri.length && !s.libur) h+='<div class="mut">Belum ada yang absen.</div>';
      s.entri.forEach(function(e){ h+='<div class="row"><div>'+esc(e.nama)+tagEntri(e)+'</div><div>'+jamEntri(e)+'</div></div>'; });
      h+='</div>';
    });
    modal(h+'<button class="btn ghost" onclick="modal()">Tutup</button>');
  }).catch(gagal);
}

function viewSusulan(){
  var now=S.status.now;
  modal('<h3>Absen susulan</h3><p class="mut" style="margin:0">Untuk shift yang lupa diabsen. Nanti disetujui pemilik.</p>'+
    '<label>Tanggal</label><input id="sTgl" type="date" max="'+now.tanggal+'" value="'+now.tanggal+'" onchange="$(\'sShift\').innerHTML=opsiShift(this.value)">'+
    '<label>Shift</label><select id="sShift">'+opsiShift(now.tanggal)+'</select>'+
    '<div class="grid"><div><label>Jam datang</label><input id="sDat" type="time"></div><div><label>Jam pulang</label><input id="sPul" type="time"></div></div>'+
    '<div class="mut" style="margin-top:4px">Jam pulang boleh dikosongkan, nanti otomatis jam akhir shift.</div>'+
    '<label>Alasan singkat</label><input id="sAl" placeholder="mis. HP mati / lupa">'+
    sp(14)+'<button class="btn pri" onclick="kirimSusulan()">Kirim</button>'+sp()+'<button class="btn ghost" onclick="modal()">Batal</button>');
}
function kirimSusulan(){
  var d={tanggal:$('sTgl').value,shift:$('sShift').value,datang:$('sDat').value,pulang:$('sPul').value,alasan:$('sAl').value};
  api('apiSusulan',S.user.nama,S.user.pin,d,hpId()).then(function(r){ modal(); toast(r.pesan); muatStatus(true); }).catch(gagal);
}

function viewAjuan(tgl,shift){
  var now=S.status.now; tgl=tgl||now.tanggal; S._jenis='izin';
  var teman=S.init.pegawai.filter(function(n){return n!==S.status.nama;}).map(function(n){return '<option>'+esc(n)+'</option>';}).join('');
  modal('<h3>Izin / tukar shift</h3><p class="mut" style="margin:0">Pengajuan dikirim ke pemilik. Kalau disetujui, jadwal otomatis berubah.</p>'+

  api('apiHariIni',tgl).then(function(d){
    S.adm.hari=d;
    var h='<div class="nav"><button class="btn sm ghost" onclick="S.adm.tgl=addDays(S.adm.tgl,-1);aHari()">◀</button><div class="t">'+esc(d.label.hari+', '+d.label.tanggal)+'</div><button class="btn sm ghost" onclick="S.adm.tgl=addDays(S.adm.tgl,1);aHari()">▶</button></div>';

    h+='<div class="grid" style="margin-bottom:12px"><button class="btn pri" onclick="laporanWA()">📤 Laporan ke WA</button><button class="btn" onclick="jadwalBesokWA()">📋 Jadwal besok ke WA</button></div>';
    d.shifts.forEach(function(s){
      var cls=s.libur?' libur':s.peringatan?' '+s.peringatan.level:'';
      var tg=s.libur?'<span class="tag t-lib">libur</span>':'<span class="tag '+(s.terisi>=s.butuh?'t-run':s.peringatan&&s.peringatan.level==='kosong'?'t-no':'t-auto')+'">'+s.terisi+'/'+s.butuh+'</span>';
      h+='<div class="card'+cls+'"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">'+esc(s.nama)+' <span class="mut">'+titik(s.mulai)+'–'+titik(s.selesai)+'</span>'+(s.khusus?'<span class="tag t-kh">khusus</span>':'')+'</h3>'+tg+'</div>';
      if (s.peringatan && !s.libur) h+='<div style="color:#b91c1c;font-size:13px;font-weight:600">'+(s.peringatan.level==='kosong'?'Belum ada yang absen':'Baru '+s.terisi+' dari '+s.butuh+' orang yang absen')+'</div>';
      if (s.jadwal.length && !s.libur) h+='<div class="mut">Jadwal: '+esc(s.jadwal.join(', '))+'</div>';
      s.entri.forEach(function(e){ h+='<div class="row tap" onclick="editAbsen(\''+e.id+'\')"><div><b>'+esc(e.nama)+'</b>'+tagEntri(e,true)+'</div><div>'+jamEntri(e)+' ✎</div></div>'; });
      if (!d.kunci) h+='<div style="margin-top:6px"><button class="btn sm ghost" onclick="editAbsen(null,\''+s.id+'\')">+ Tambah manual</button></div>';
      h+='</div>';
    });
    h+='<p class="mut">Ketuk nama untuk mengubah. Label: <span class="tag t-auto">otomatis</span> lupa absen pulang · <span class="tag t-ed">diubah</span> sudah diubah pemilik · <span class="tag t-hp">HP lain</span> absen dari HP yang berbeda dari biasanya · <span class="tag t-run">📍 tablet</span> absen dari tablet warung · <span class="tag t-kh">di luar jadwal</span> absen di shift yang bukan jadwalnya.</p>';
    $('aview').innerHTML=h;
  }).catch(gagal);
}

function jadwalBesokWA(){ api('apiJadwalWA',addDays(S.adm.data.now.tanggal,1)).then(function(t){ tampilTeks('Jadwal besok',t); }).catch(gagal); }
function semuaEntri(){ var a=[]; if(S.adm.hari) S.adm.hari.shifts.forEach(function(s){ a=a.concat(s.entri); }); return a.concat(S.adm.data.pending); }
function editAbsen(id,shiftId){
  var e = id ? semuaEntri().filter(function(x){return x.id===id;})[0] : null;

  if (e.nama && !S.adm.data.pegawai.some(function(p){return p.nama===e.nama;})) namaOpt+='<option selected>'+esc(e.nama)+'</option>';
  var stOpt=[['ok','Sah'],['menunggu','Menunggu'],['ditolak','Ditolak']].map(function(x){return '<option value="'+x[0]+'"'+(x[0]===e.status?' selected':'')+'>'+x[1]+'</option>';}).join('');
  modal('<h3>'+(e.id?'Ubah absen':'Tambah absen')+'</h3>'+(e.alasan?'<div class="mut">Alasan: '+esc(e.alasan)+'</div>':'')+(e.diubah?'<div class="mut">Terakhir diubah: '+esc(e.diubah)+'</div>':'')+
    '<div class="grid"><div><label>Tanggal</label><input id="eTgl" type="date" value="'+e.tanggal+'" onchange="$(\'eSh\').innerHTML=opsiShift(this.value,$(\'eSh\').value)"></div><div><label>Shift</label><select id="eSh">'+opsiShift(e.tanggal,e.shift)+'</select></div></div>'+

    '<label>Status</label><select id="eSt">'+stOpt+'</select>'+

function simpanAbsen(){

}

function putuskan(id,y){ api('apiAdminPutuskanAjuan',S.adm.pin,id,y).then(function(d){ S.adm.data=d; renderAdmin(); toast(y?'Disetujui, jadwal diperbarui ✅':'Ditolak'); }).catch(gagal); }

function aRekap(){
  var d=S.adm.data, per=S.adm.periode||{dari:d.periodeMulai, sampai:d.now.tanggal};
  var h='<div class="card"><h3>Periode gajian</h3><div class="grid"><div><label>Dari</label><input id="rD" type="date" value="'+per.dari+'"></div><div><label>Sampai</label><input id="rS" type="date" value="'+per.sampai+'"></div></div>'+
    sp(12)+'<button class="btn pri" onclick="hitungRekap()">Tampilkan rekap</button></div><div id="rOut"></div>';
  if (d.periode.length){
    h+='<div class="card"><h3>Periode yang sudah tutup buku 🔒</h3>';
    d.periode.forEach(function(p){ h+='<div class="row"><div>'+esc(tglPendek(p.dari))+' – '+esc(tglPendek(p.sampai))+'<br><span class="mut">ditutup '+esc(p.ditutup)+'</span></div><div style="display:flex;gap:6px"><button class="btn sm ghost" onclick="lihatPeriode(\''+p.dari+'\',\''+p.sampai+'\')">Lihat</button><button class="btn sm ghost" onclick="bukaBuku(this,\''+p.id+'\')">Buka kunci</button></div></div>'; });
    h+='</div>';
  }
  $('aview').innerHTML=h;

}
function lihatPeriode(a,b){ $('rD').value=a; $('rS').value=b; hitungRekap(); }
function hitungRekap(){
  var dari=$('rD').value, sampai=$('rS').value; S.adm.periode={dari:dari,sampai:sampai};
  api('apiAdminRekap',S.adm.pin,dari,sampai).then(function(r){ S.adm.rekap=r; tampilRekap(r); }).catch(gagal);
}
function tampilRekap(r){
  var h='<div class="card"><h3>Jam kerja '+esc(tglPendek(r.dari))+' – '+esc(tglPendek(r.sampai))+(r.tutup?' 🔒':'')+'</h3>';
  if (r.pending) h+='<div class="status" style="margin-top:0">⚠️ Ada '+r.pending+' absen susulan yang belum diputuskan di periode ini (belum dihitung).</div>';
  h+='<table><tr><th>Nama</th><th class="r">Shift</th><th class="r">Jam kerja</th></tr>';
  r.ringkas.forEach(function(x){ var k=[]; if(x.otomatis) k.push(x.otomatis+'× lupa absen pulang'); if(x.hpLain) k.push(x.hpLain+'× HP lain'); if(x.luarJadwal) k.push(x.luarJadwal+'× di luar jadwal');
    h+='<tr><td><b>'+esc(x.nama)+'</b> <button class="btn sm ghost" style="padding:3px 7px;font-size:12px" data-n="'+esc(x.nama)+'" onclick="rincianPegawai(this.dataset.n)">📤 rincian</button>'+(k.length?'<div class="mut" style="font-size:11.5px">'+k.join(' · ')+'</div>':'')+'</td><td class="r">'+x.shift+'</td><td class="r"><b>'+esc(x.durasi)+'</b><div class="mut" style="font-size:11.5px">'+x.jamDesimal+' jam</div></td></tr>'; });
  if (!r.ringkas.length) h+='<tr><td colspan="3" class="mut">Belum ada data.</td></tr>';
  h+='</table>'+sp(12)+'<div class="grid"><button class="btn" onclick="salinRekap()">Salin rekap</button><button class="btn" onclick="simpanRekapSheet()">Simpan ke Sheet</button></div>';
  if (r.tutup) h+='<p class="mut" style="margin:10px 0 0">🔒 Periode ini sudah tutup buku ('+esc(r.tutup.ditutup)+'). Absen di dalamnya tidak bisa diubah.</p>';
  else if (r.bisaTutup) h+=sp(10)+'<button class="btn pri" onclick="tutupBuku(this)">🔒 Tutup buku periode ini</button><p class="mut" style="margin:6px 0 0">Setelah ditutup, absen di periode ini tidak bisa diubah, termasuk lewat absen susulan.</p>';
  else h+='<p class="mut" style="margin:10px 0 0">Tutup buku bisa dilakukan kalau '+(r.tumpang?'periodenya tidak bertumpuk dengan periode yang sudah ditutup.':r.pending?'semua absen susulan di periode ini sudah diputuskan.':'tanggal akhir periode sebelum hari ini.')+'</p>';
  h+='</div>';
  if (r.kosong.length){
    h+='<div class="card"><details><summary>Shift kurang orang ('+r.kosong.length+')</summary>';
    r.kosong.forEach(function(k){ h+='<div class="row"><div>'+esc(tglPendek(k.tanggal))+' · '+esc(k.shift)+'</div><div class="tag t-auto">'+k.terisi+'/'+(k.butuh||2)+'</div></div>'; });
    h+='</details></div>';
  }
  h+='<div class="card"><details><summary>Rincian per absen ('+r.detail.length+')</summary>';
  r.detail.forEach(function(d){ h+='<div class="row"><div>'+esc(tglPendek(d.tanggal))+' · '+esc(d.shiftNama)+'<br><b>'+esc(d.nama)+'</b>'+tagEntri(d,true)+'</div><div style="text-align:right">'+jamEntri(d)+'<br><span class="mut">'+durasi(d.menit)+'</span></div></div>'; });
  h+='</details></div>';
  $('rOut').innerHTML=h;
}
function rincianPegawai(nama){
  var r=S.adm.rekap, rows=r.detail.filter(function(d){return d.nama===nama;}), x=r.ringkas.filter(function(y){return y.nama===nama;})[0];
  var L=['*Rincian Jam Kerja — '+nama+'*', S.adm.data.warung, 'Periode: '+tglPendek(r.dari)+' s.d. '+tglPendek(r.sampai), ''];
  rows.forEach(function(d,i){ L.push((i+1)+'. '+tglPendek(d.tanggal)+' · '+d.shiftNama+' · '+titik(d.datang)+'–'+(d.berjalan?'…':titik(d.pulangEff))+' · '+durasi(d.menit)+(d.otomatis?' (lupa absen pulang)':'')); });

function senin(t){ var p=t.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]); var g=(d.getDay()+6)%7; return addDays(t,-g); }
function aJadwal(){
  S.adm.jSub=S.adm.jSub||'tanggal';
  var subs=[['tanggal','Per tanggal'],['pola','Pola tetap'],['luang','Jam luang']];
  var h='<div class="chips" style="margin-top:0">'+subs.map(function(x){return '<button class="chip'+(S.adm.jSub===x[0]?' on':'')+'" onclick="S.adm.jSub=\''+x[0]+'\';aJadwal()">'+x[1]+'</button>';}).join('')+'</div><div id="jview"></div>';
  $('aview').innerHTML=h;
  ({tanggal:jTanggal,pola:jPola,luang:jLuang})[S.adm.jSub]();
}
function pegAktif(){ return S.adm.data.pegawai.filter(function(p){return p.aktif;}).map(function(p){return p.nama;}); }
function selNama(id,v,dis,tersedia){
  var peg=pegAktif(), t=(tersedia||[]).map(function(x){return x.toLowerCase();});
  var urut=peg.slice().sort(function(a,b){ return (t.indexOf(b.toLowerCase())>=0)-(t.indexOf(a.toLowerCase())>=0); });
  var o='<option value="">–</option>'+urut.map(function(n){var ok=t.indexOf(n.toLowerCase())>=0; return '<option value="'+esc(n)+'"'+(n===v?' selected':'')+'>'+(ok?'✓ ':'')+esc(n)+'</option>';}).join('');
  if(v&&peg.indexOf(v)<0) o+='<option selected>'+esc(v)+'</option>';
  return '<select id="'+id+'"'+(dis?' disabled':'')+'>'+o+'</select>';
}
function slotHTML(prefix,s,extraLeft){
  var n=Math.max(s.butuh||2,(s.nama||[]).length), sels='';
  for(var x=0;x<n;x++) sels+=selNama(prefix+'_n'+x,(s.nama||[])[x]||'',s.libur,s.tersedia);
  return '<div class="jslot"><div class="jlbl">'+esc(s.shiftNama)+(extraLeft||'')+'</div><div class="jsel" style="grid-template-columns:repeat('+Math.min(n,2)+',1fr)">'+sels+'</div>'+
    '<label class="lb" style="margin:0"><input type="checkbox" class="sw" id="'+prefix+'_L"'+(s.libur?' checked':'')+' onchange="liburSlot(\''+prefix+'\','+n+')">libur</label></div>';
}
function liburSlot(prefix,n){ var on=$(prefix+'_L').checked; for(var x=0;x<n;x++){ var e=$(prefix+'_n'+x); if(e) e.disabled=on; } }
function bacaSlot(prefix,s){ var n=Math.max(s.butuh||2,(s.nama||[]).length), out=[]; for(var x=0;x<n;x++){ var v=$(prefix+'_n'+x).value; if(v) out.push(v); } return {nama:out, libur:$(prefix+'_L').checked}; }

function jTanggal(){

}
function renderJTanggal(j){

  h+='<p class="mut" style="margin:0 0 10px">Jadwal di sini otomatis mengikuti pola tetap. Ubah hanya untuk tanggal tertentu (izin, tukar, libur, pesanan). Tanggal yang diubah ditandai <span class="tag t-ed">diubah</span>.</p>';
  j.hari.forEach(function(d,i){
    var adaUbah=d.slot.some(function(s){return s.diubah;});
    h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:6px;flex-wrap:wrap"><b>'+esc(tglPendek(d.tanggal))+(adaUbah?' <span class="tag t-ed">diubah</span>':'')+'</b><div style="display:flex;gap:6px;flex-wrap:wrap">'+
      (adaUbah?'<button class="btn sm ghost" onclick="ikutiPola(\''+d.tanggal+'\')">Ikuti pola</button>':'')+
      '<button class="btn sm ghost" onclick="tutupSeharian('+i+')">Tutup seharian</button><button class="btn sm ghost" onclick="kirimJadwalHari(\''+d.tanggal+'\')">Kirim WA</button></div></div>';
    d.slot.forEach(function(s,k){
      var kiri=s.khusus?'<br><span class="mut" style="font-size:10.5px">'+titik(s.mulai)+'–'+titik(s.selesai)+' <a href="#" onclick="hapusKhusus(event,\''+s.shift+'\')" style="color:var(--no)">hapus</a></span>':'';
      if (s.diubah && !s.khusus) kiri+='<br><span class="mut" style="font-size:10.5px">pola: '+(s.liburPola?'libur':esc(s.pola.join(', ')||'–'))+'</span>';
      h+=slotHTML('t'+i+'_'+k,s,kiri);
    });
    h+='<button class="btn sm ghost" style="margin-top:4px" onclick="formKhusus(\''+d.tanggal+'\')">+ Shift khusus (pesanan)</button></div>';
  });
  h+='<button class="btn pri" onclick="simpanJadwal()">Simpan perubahan</button>';
  $('jview').innerHTML=h;
}
function tutupSeharian(i){
  var d=S.adm.jad.hari[i], semua=d.slot.every(function(s,k){return $('t'+i+'_'+k+'_L').checked;});
  d.slot.forEach(function(s,k){ var p='t'+i+'_'+k; $(p+'_L').checked=!semua; liburSlot(p,Math.max(s.butuh||2,(s.nama||[]).length)); });
  toast(semua?'Libur dibatalkan. Jangan lupa Simpan.':'Ditandai tutup seharian. Jangan lupa Simpan.');
}
function bacaJadwal(){ var out=[]; S.adm.jad.hari.forEach(function(d,i){ d.slot.forEach(function(s,k){ var r=bacaSlot('t'+i+'_'+k,s); out.push({tanggal:d.tanggal,shift:s.shift,nama:r.nama,libur:r.libur}); }); }); return out; }
function simpanJadwal(diam){
  return api('apiAdminSimpanJadwal',S.adm.pin,bacaJadwal()).then(function(){ if(!diam){ toast('Jadwal tersimpan ✅'); jTanggal(); } })
    .catch(function(e){ gagal(e); throw e; });
}
function ikutiPola(t){ simpanJadwal(true).then(function(){ return api('apiAdminKembalikanPola',S.adm.pin,t); }).then(function(){ toast('Tanggal itu kembali mengikuti pola'); jTanggal(); }).catch(function(){}); }
function kirimJadwalHari(t){ simpanJadwal(true).then(function(){ return api('apiJadwalWA',t); }).then(function(x){ tampilTeks('Jadwal jaga',x); }).catch(function(){}); }
function formKhusus(t){
  modal('<h3>Shift khusus</h3><p class="mut" style="margin:0">Untuk pesanan atau kerja di luar jam shift biasa, hanya berlaku di '+esc(tglPendek(t))+'.</p>'+
    '<label>Nama</label><input id="kNm" value="Pesanan">'+
    '<div class="grid"><div><label>Mulai</label><input id="kM" type="time"></div><div><label>Selesai</label><input id="kS" type="time"></div></div>'+
    '<div class="g3"><div><label>Butuh orang</label><input id="kB" type="number" min="1" max="4" value="2"></div><div><label>+ menit sebelum</label><input id="kTM" type="number" min="0" value="0"></div><div><label>+ menit sesudah</label><input id="kTP" type="number" min="0" value="30"></div></div>'+

function simpanKhusus(t){
  var d={tanggal:t,nama:$('kNm').value,mulai:$('kM').value,selesai:$('kS').value,butuh:$('kB').value,tambahMasuk:$('kTM').value,tambahPulang:$('kTP').value};

function jPola(mulai){

      var kiri=s.tersedia.length?'<br><span class="mut" style="font-size:10.5px">bisa: '+esc(s.tersedia.join(', '))+'</span>':'';

function bacaPola(){ var out=[]; S.adm.pola.hari.forEach(function(d,i){ d.slot.forEach(function(s,k){ var r=bacaSlot('p'+i+'_'+k,s); out.push({hari:d.hari,shift:s.shift,nama:r.nama,libur:r.libur}); }); }); return out; }
function simpanPola(){

function polaBaru(){
  var p=S.adm.pola, isi=bacaPola();

  renderPola(p);
  toast('Pola baru (disalin dari pola tadi). Atur tanggal berlaku mulai & nama, lalu Simpan.');
}
function hapusPola(b){
  if (!b.dataset.y){ b.dataset.y=1; b.textContent='Ketuk lagi untuk yakin hapus pola ini'; return; }

      '<div class="g3"><div><label>Butuh orang</label><input id="shB'+i+'" type="number" min="1" max="4" value="'+s.butuh+'"></div><div><label>+ menit sebelum</label><input id="shTM'+i+'" type="number" min="0" value="'+s.tambahMasuk+'"></div><div><label>+ menit sesudah</label><input id="shTP'+i+'" type="number" min="0" value="'+s.tambahPulang+'"></div></div></div>';
  });
  h+='<p class="mut" style="margin:6px 0 0">Tombol absen masuk muncul 60 menit sebelum shift (atau lebih awal kalau tambahan sebelum lebih dari 60).</p></div>';
  var n=d.notif||{menitIngat:60,menitBelumMasuk:15,pulang:true};
  h+='<div class="card"><h3>Notifikasi</h3>'+
    '<label>Ingatkan pegawai sebelum jadwal jaga (menit)</label><input id="nIng" type="number" min="0" value="'+n.menitIngat+'">'+
    '<label>Ingatkan kalau belum absen masuk setelah shift mulai (menit)</label><input id="nBel" type="number" min="0" value="'+n.menitBelumMasuk+'">'+
    '<label>Pengingat kedua kalau shift masih kurang orang (menit setelah shift mulai)</label><input id="nKed" type="number" min="0" value="'+(n.menitKedua==null?45:n.menitKedua)+'">'+
    '<label style="display:flex;align-items:center;gap:8px"><input id="nPul" class="sw" type="checkbox"'+(n.pulang?' checked':'')+'> Ingatkan absen pulang saat shift selesai</label>'+
    '<div class="mut">Isi 0 untuk mematikan. Pemilik juga dapat notifikasi saat ada shift kosong, absen susulan, pengajuan izin/tukar, atau jam luang diperbarui.</div>'+
    '<div class="hr"></div><b>📊 Laporan harian otomatis</b>'+
    '<label>Kirim jam (kosongkan untuk mematikan)</label><input id="nLJ" type="time" value="'+(n.laporanJam||'')+'">'+
    '<label style="display:flex;align-items:center;gap:8px"><input id="nLP" class="sw" type="checkbox"'+(n.laporanPemilik!==false?' checked':'')+'> Kirim ke HP pemilik</label>'+
    '<label style="display:flex;align-items:center;gap:8px"><input id="nLT" class="sw" type="checkbox"'+(n.laporanTablet!==false?' checked':'')+'> Kirim ke tablet warung</label>'+
    '<div class="hr"></div><b>Notifikasi pemilik di HP ini</b><div id="notifAdm" class="mut" style="margin-top:6px">Memeriksa…</div></div>';
  h+='<div class="card"><h3>📍 Tablet / perangkat warung</h3><p class="mut" style="margin:0 0 8px">Perangkat warung dipakai bergantian untuk absen: tidak dianggap "HP lain", tidak menyimpan login pegawai, dan absennya diberi label 📍 tablet. Terdaftar: '+(d.jumlahPerangkatWarung||0)+' perangkat.</p>'+
    (S.init.kiosk ? '<div class="status" style="margin-top:0">✅ Perangkat ini adalah tablet warung.</div><div id="notifTab" class="mut" style="margin-bottom:8px"></div><button class="btn ghost" onclick="aturTablet(false)">Lepas status tablet warung</button>'
      : '<button class="btn" onclick="aturTablet(true)">Jadikan perangkat ini tablet warung</button><div class="mut" style="margin-top:6px">Tekan tombol ini dari tablet warung, bukan dari HP Anda.</div>')+'</div>';
  h+='<div class="card"><h3>PIN pemilik</h3><label>PIN baru (kosongkan jika tidak diganti)</label><input id="sPin" type="password" inputmode="numeric" maxlength="8"></div>';
  h+='<button class="btn pri" onclick="simpanAtur()">Simpan pengaturan</button>';
  $('aview').innerHTML=h;
  if (S.init.kiosk) cekNotif(function(st){
    var el=$('notifTab'); if(!el) return;
    if (st==='belum') el.innerHTML='<button class="btn" onclick="aktifkanNotif(\'warung\',aAtur)">🔔 Aktifkan notifikasi di tablet (laporan harian & pengumuman)</button>';
    else if (st==='aktif') { notifLogin('warung'); el.innerHTML='🔔 Notifikasi tablet aktif.'; }
  });
  if (S.init.kiosk){ var na=$('notifAdm'); if(na) na.innerHTML='Ini tablet warung, notifikasi pemilik diaktifkan dari HP Anda.'; return; }
  cekNotif(function(st){
    var el=$('notifAdm'); if(!el) return;
    if (st==='mati') el.innerHTML='Notifikasi hanya bisa diaktifkan dari aplikasi versi GitHub Pages (link baru).';
    else if (st==='ios') el.innerHTML='Di iPhone: Bagikan → Tambahkan ke Layar Utama, lalu buka dari ikon itu.';
    else if (st==='tidak') el.innerHTML='Browser ini tidak mendukung notifikasi. Coba pakai Chrome.';
    else if (st==='belum') el.innerHTML='<button class="btn" onclick="aktifkanNotif(\'pemilik\',aAtur)">🔔 Aktifkan notifikasi pemilik</button>';
    else { notifLogin('pemilik'); el.innerHTML='🔔 Aktif. <button class="btn sm ghost" onclick="tesNotif()">Kirim tes</button>'; }
  });
}
function aturTablet(y){
  api('apiAdminPerangkatWarung',S.adm.pin,hpId(),y).then(function(r){
    S.init.kiosk=r.kiosk;
    if (r.kiosk){ ls('absensi-user',null); ls('absensi-admin',null); notifLogin('warung'); toast('Perangkat ini sekarang tablet warung ✅ Keluar dari mode pemilik untuk mulai dipakai.'); }
    else toast('Status tablet warung dilepas.');
    return refreshAdminData();
  }).then(renderAdmin).catch(gagal);
}
function tesNotif(){ api('apiAdminTesNotif',S.adm.pin).then(function(r){ toast(r.pesan,!r.ok); }).catch(gagal); }
function simpanAtur(){
  var d=S.adm.data, sh=d.shifts.map(function(s,i){ return {id:s.id,nama:$('shN'+i).value,mulai:$('shM'+i).value,selesai:$('shS'+i).value,tambahMasuk:$('shTM'+i).value,tambahPulang:$('shTP'+i).value,butuh:$('shB'+i).value}; });
  var baru=$('sPin').value.trim();
  api('apiAdminSimpanPengaturan',S.adm.pin,{namaWarung:$('sNama').value,tandaKosong:$('sTK').value,shifts:sh,pinAdminBaru:baru,notif:{menitIngat:$('nIng').value,menitBelumMasuk:$('nBel').value,menitKedua:$('nKed').value,pulang:$('nPul').checked,laporanJam:$('nLJ').value,laporanPemilik:$('nLP').checked,laporanTablet:$('nLT').checked}}).then(function(x){
    if (baru){ S.adm.pin=baru; ls('absensi-admin',baru); }
    S.adm.data=x; return api('apiInit',hpId());
  }).then(function(i){ S.init=i; $('hWarung').textContent=i.warung; toast('Pengaturan tersimpan ✅'); renderAdmin(); }).catch(gagal);
}

mulai();
</script>
</body>
</html>
